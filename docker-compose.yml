# The whole system in containers: database, API, admin dashboard and mobile PWA.
#
#   docker compose up -d --build     everything
#   docker compose run --rm seed     load the demo data once the database is up
#   docker compose up -d postgres redis mailpit    infrastructure only, for `pnpm dev:*`
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring
      POSTGRES_DB: monitoring
    # 5442 on the host: 5432 and 5433 are often already taken on a developer machine.
    ports: ['5442:5432']
    volumes: ['monitoring-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monitoring']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['6382:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['monitoring-redis:/data']

  # Catches the Room Alert alert mails the IMAP poller will read. UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ['1025:1025', '8025:8025']

  # The broker the AKCP sensorProbe+ units publish into. The API subscribes to it; the units
  # (or `docker compose run --rm akcp-sim`) publish spp/<mac>/sensor/<event>/<compound id>.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports: ['1883:1883']
    volumes:
      - './docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro'
      - 'monitoring-mqtt:/mosquitto/data'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    restart: unless-stopped
    # A fixed hostname gives the AKCP subscriber the same MQTT client id across container
    # recreates (akcp-monitoring-api), so the broker keeps its session, and it differs from the
    # id a local `pnpm dev:api` derives from the laptop's hostname, so the two never collide.
    hostname: monitoring-api
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://monitoring:monitoring@postgres:5432/monitoring?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-at-least-32-characters-long-secret}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081,http://localhost:5173,http://localhost:5174}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://mosquitto:1883}
    # 3300 on the host: 3000 is what `pnpm dev:api` uses, and an ssh tunnel often holds it.
    ports: ['${API_PORT:-3300}:3000']
    volumes: ['monitoring-uploads:/app/data/uploads']

  admin:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args: { APP: admin }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    # Where the browser reaches the API, which is the host port, not the compose network.
    environment:
      API_URL: ${API_URL:-http://localhost:3300}
    ports: ['8080:8080']

  mobile:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args: { APP: mobile }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_URL: ${API_URL:-http://localhost:3300}
    ports: ['8081:8080']

  # One-shot: loads the generated fixtures, shifted so the newest row lands now.
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: seed
    profiles: ['tools']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://monitoring:monitoring@postgres:5432/monitoring?sslmode=disable

  # One-shot: publishes what an AKCP unit would, so the ingestion path can run without hardware.
  #   docker compose run --rm akcp-sim -mac 0080A3000001 -critical
  akcp-sim:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: akcpsim
    profiles: ['tools']
    depends_on:
      mosquitto: { condition: service_started }
    command: ['-broker', 'tcp://mosquitto:1883']

volumes:
  monitoring-pg:
  monitoring-mqtt:
  monitoring-redis:
  monitoring-uploads:
