# Local broker for the AKCP units and the simulator. Anonymous access keeps a bench simple;
# a deployment puts a password file here and points MQTT_USERNAME and MQTT_PASSWORD at it.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# A subscriber with a persistent session that never returns (an old client id, a laptop that
# ran the API once) would queue messages forever. Forget such sessions after a week.
persistent_client_expiration 7d
