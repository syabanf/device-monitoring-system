server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite fingerprints everything under /assets, so it can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The container writes this file at startup, so every visitor reads the current API URL.
  location = /env.js {
    add_header Cache-Control "no-store";
  }

  # The service worker must never come from cache, or an update never reaches the phone.
  location = /sw.js {
    add_header Cache-Control "no-store";
  }

  # nginx 1.27 ships no mapping for the PWA manifest, and the browser wants the right type.
  location ~ \.webmanifest$ {
    default_type application/manifest+json;
  }

  # A single page app: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
